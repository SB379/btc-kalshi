[package]
name = "signal"
version = "0.1.0"
edition = "2021"

[dependencies]
shared-types = { path = "../../shared/types" }
tokio = { version = "1", features = ["full"] }
ringbuf = "0.4"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
time = { version = "0.3", features = ["parsing"] }
